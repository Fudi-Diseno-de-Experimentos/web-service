# Nombre identificativo del flujo en la pestaña Actions de GitHub
name: Core Verification - Continuous Integration

# Disparadores (Events): Se ejecuta al hacer merge o push directo a estas ramas
on:
  push:
    branches: [ main, develop ]

# Trabajos a ejecutar en los servidores en la nube de GitHub
jobs:
  run-backend-tests:
    name: Compile and Execute Test Suites
    runs-on: ubuntu-latest # Sistema operativo virtual limpio

    steps:
      # 1. Clonar el código fuente del repositorio en el contenedor virtual
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Configurar el entorno de ejecución de Java
      - name: Set up OpenJDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26' # Versión que estás usando según tus capturas
          distribution: 'temurin'
          cache: 'maven' # Almacena dependencias para agilizar futuras ejecuciones

      # 3. Descargar dependencias y compilar el proyecto en Spring Boot
      - name: Compile Application
        run: mvn clean compile

      # 4. Ejecutar todas las pruebas unitarias e integrales (Multi-tenancy, Events, Announcements)
      - name: Execute Core Test Suites
        run: mvn test