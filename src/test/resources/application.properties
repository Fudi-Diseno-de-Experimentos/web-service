spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Propiedades requeridas por la configuración de Seguridad/IAM en tests
authorization.jwt.secret=estaEsUnaClaveSecretaSimuladaParaTestingDeAlMenos32Caracteres
authorization.jwt.expiration.days=7
# Propiedades requeridas para OpenAPI / Configuración de la aplicación
spring.application.name=centralis-web-service-test
documentation.application.description=Descripción simulada para testing
documentation.application.version=1.0.0